name: Deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC (05:17/06:17 Israel time)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install text extraction tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils catdoc
          pip install -q python-docx pillow
      # files already downloaded and processed are kept between builds (refreshed every week),
      # so each build asks Drive only for what is new
      - name: Week of the year
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .drive-cache
          key: drive-${{ steps.week.outputs.week }}-${{ github.run_id }}
          restore-keys: drive-${{ steps.week.outputs.week }}-
      - name: Read the Drive folder
        run: python scripts/crawl.py data-items.json
      - name: Build the site
        env:
          DRIVE_CACHE: .drive-cache
        run: |
          python scripts/build.py data-items.json data-docs.json data-new.json
          python scripts/tree.py data-items.json data-tree.json
          python scripts/foldercovers.py data-tree.json data-docs.json .drive-cache/fcovers
          python scripts/check.py data-docs.json
          mkdir -p _site
          python scripts/covers.py data-new.json .drive-cache/covers
          python scripts/videos.py src/videos.json data-videos.json
          python scripts/spotify.py src/spotify.json data-spotify.json
          python scripts/assemble.py src data-docs.json data-tree.json _site/index.html data-new.json data-videos.json data-spotify.json
          python scripts/fulltext.py data-docs.json _site/text.json || echo "search inside booklets not updated"
          python scripts/zmanim.py data-items.json _site/zmanim.json || echo "zmanim table not updated"
          cp robots.txt .nojekyll _site/
          cp data-videos.json _site/videos.json
          cp data-spotify.json _site/spotify.json
          cp static/* _site/
          mkdir -p _site/fcovers _site/covers
          cp -r .drive-cache/fcovers/. _site/fcovers/ 2>/dev/null || true
          cp -r .drive-cache/covers/. _site/covers/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
